name: cargo
on:
  push:
    tags:
      - v*
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: dummy build
        run: |
          mkdir -p package
          echo "test release artifact" > package/xremap-test.txt
          zip package/xremap-test.zip package/xremap-test.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xremap-test
          path: package/xremap-test.zip

  release:
    runs-on: ubuntu-latest
    needs:
      - build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: xremap-test
          path: package/

      - name: Release
        run: |
          set -e
          export VERSION=$(echo "$GITHUB_REF" | sed -e 's!refs/tags/!!')
          curl -L "https://github.com/tcnksm/ghr/releases/download/${GHR_VERSION}/ghr_${GHR_VERSION}_linux_amd64.tar.gz" -o ghr.tar.gz
          printf "%s\n" "bdf8f7134ac5362c18debf34e10fd50b5141d9d7ae4d9f3863b67236a31012eb  ghr.tar.gz" | sha256sum -c --strict
          tar xvzf ghr.tar.gz
          "ghr_${GHR_VERSION}_linux_amd64/ghr" -u "${GITHUB_REPOSITORY_OWNER}" -r "${GITHUB_REPOSITORY#*/}" -replace -commitish "$GITHUB_SHA" -generatenotes -b "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/CHANGELOG.md)" -n "$VERSION" "$VERSION" package/
        env:
          GHR_VERSION: v0.17.0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
