name: cargo
on:
  push:
    tags:
      - v*
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: dummy build
        run: |
          mkdir -p package
          echo "test release artifact" > package/xremap-test.txt
          zip package/xremap-test.zip package/xremap-test.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xremap-test
          path: package/xremap-test.zip

  release:
    runs-on: ubuntu-latest
    needs:
      - build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: xremap-test
          path: package/

      - name: Release
        uses: tcnksm/ghr@v0.18.6
        with:
          owner: ${{ github.repository_owner }}
          repository: ${{ github.event.repository.name }}
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          path: package/
          replace: true
          generatenotes: true
          body: "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)"
